# Isolated rehearsal: never points at Neon or uses production credentials.
name: workout-tracker-preview

services:
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: default
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/workout_preview
      SPRING_DATASOURCE_USERNAME: preview
      SPRING_DATASOURCE_PASSWORD: preview_only
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
      APP_FRONTEND_BASE_URL: http://localhost:18080
      APP_CORS_ALLOWED_ORIGINS: http://localhost:18080
      APP_MAIL_PROVIDER: smtp
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_SMTP_AUTH: 'false'
      SPRING_MAIL_STARTTLS_ENABLE: 'false'
    ports:
      - '127.0.0.1:18081:8080'
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:18080:8080'
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workout_preview
      POSTGRES_USER: preview
      POSTGRES_PASSWORD: preview_only
    volumes:
      - preview_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U preview -d workout_preview']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:18025:8025'

volumes:
  preview_data:
