spring.application.name=workout-tracker-backend

spring.datasource.url=${TEST_SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workout_tracker?currentSchema=workout_tracker_test}
spring.datasource.username=${TEST_SPRING_DATASOURCE_USERNAME:workout_user}
spring.datasource.password=${TEST_SPRING_DATASOURCE_PASSWORD:workout_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.schemas=workout_tracker_test
spring.flyway.default-schema=workout_tracker_test
spring.flyway.create-schemas=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.jpa.properties.hibernate.default_schema=workout_tracker_test
