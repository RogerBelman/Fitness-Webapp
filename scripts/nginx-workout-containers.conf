server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name workouts.rogerbelman.com;
    ssl_certificate /etc/letsencrypt/live/workouts.rogerbelman.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workouts.rogerbelman.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 10m;
    add_header X-Workout-Release "__RELEASE_SHA__" always;

    location /api/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /actuator { return 404; }
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name workouts.rogerbelman.com;
    return 301 https://$host$request_uri;
}
