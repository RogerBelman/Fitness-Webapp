services:
  postgres:
    image: postgres:17-alpine
    container_name: workout-tracker-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workout_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-workout_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workout_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-workout_user} -d ${POSTGRES_DB:-workout_tracker}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: workout-tracker-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
