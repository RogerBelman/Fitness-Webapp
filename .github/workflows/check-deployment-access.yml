name: Check deployment access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection:
    name: Verify production SSH connection
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check restricted deployment connection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST environment secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER environment secret}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY environment secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS environment secret}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          connection_dir=$(mktemp -d)
          trap 'rm -rf -- "$connection_dir"' EXIT
          chmod 700 "$connection_dir"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$connection_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$connection_dir/known_hosts"
          ssh -F /dev/null \
            -i "$connection_dir/key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$connection_dir/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "$DEPLOY_USER@$DEPLOY_HOST" status
          echo 'Restricted production SSH connection passed. No release was deployed.' >> "$GITHUB_STEP_SUMMARY"
