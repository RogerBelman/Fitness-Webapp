name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tools:
    name: Release helper checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: sh -n scripts/workout-deploy-access.sh
      - run: sh -n scripts/install-release-tools.sh

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: ''

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workout_tracker
          POSTGRES_USER: workout_user
          POSTGRES_PASSWORD: workout_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workout_user -d workout_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode --no-transfer-progress verify

  containers:
    name: Container rehearsal
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and start isolated application
        run: docker compose -f docker-compose.preview.yml up --build --detach --wait --wait-timeout 240
      - name: Check application through container network
        run: python3 scripts/check-container-preview.py
      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.preview.yml logs --no-color --tail=150
      - name: Remove test containers and their test database
        if: always()
        run: docker compose -f docker-compose.preview.yml down --volumes
